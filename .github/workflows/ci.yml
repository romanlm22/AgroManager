name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build y tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Los tests que levantan el contexto de Spring necesitan la base de datos del perfil dev.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agromanager
          POSTGRES_USER: agromanager
          POSTGRES_PASSWORD: agromanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agromanager -d agromanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # En Windows el archivo se versiona sin permiso de ejecución.
      - name: Dar permiso de ejecución a mvnw
        run: chmod +x mvnw

      - name: Compilar y correr los tests
        run: ./mvnw -B verify

  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen del backend
        run: docker build ./backend

      - name: Construir imagen del frontend
        run: docker build ./frontend

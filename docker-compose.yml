services:
  postgres:
    image: postgres:16-alpine
    container_name: agromanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agromanager
      POSTGRES_USER: agromanager
      POSTGRES_PASSWORD: agromanager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
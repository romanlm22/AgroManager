# Perfil de producción: todo lo sensible viene de variables de entorno.
# Si falta una variable obligatoria (DB_URL, DB_USER, DB_PASSWORD, JWT_SECRET) la app no arranca.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  cors:
    # Vacío = sin CORS (el frontend y la API comparten origen detrás de nginx).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  ai:
    rate-limit-per-hour: 30
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-3.5-flash-lite

logging:
  level:
    root: INFO
    com.agromanager: INFO
